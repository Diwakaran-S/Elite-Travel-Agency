<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite AI Travel Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Cyber grid background -->
    <div class="cyber-grid-bg"></div>

    <!-- Ambient glow orbs -->
    <div class="orb orb-purple"></div>
    <div class="orb orb-blue"></div>

    <div class="chat-shell">

        <!-- Header -->
        <div class="chat-header">
            <div class="header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
                    <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>
                </svg>
            </div>
            <div class="header-text">
                <span class="header-label">ELITE AI TRAVEL AGENT</span>
            </div>
            <div class="header-status">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>
        </div>

        <!-- Chat messages -->
        <div id="chat-box">
            <!-- Welcome message -->
            <div class="message bot">
                <div class="message-avatar bot-avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
                        <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>
                    </svg>
                </div>
                <div class="message-body">
                    <div class="message-bubble">
                        Welcome to Elite Travel. I'm your personal AI concierge — ready to craft extraordinary journeys. Where in the world would you like to explore?
                    </div>
                    <div class="message-time">Just now</div>
                </div>
            </div>
        </div>

        <!-- Typing indicator (hidden by default) -->
        <div id="typing-indicator" class="typing-indicator hidden">
            <div class="message bot">
                <div class="message-avatar bot-avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
                        <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>
                    </svg>
                </div>
                <div class="message-body">
                    <div class="typing-bubble">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input bar -->
        <div class="input-bar">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask about luxury destinations, packages, itineraries..."
                    autocomplete="off"
                />
                <button id="send-btn" onclick="sendMessage()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
                    </svg>
                </button>
            </div>
            <p class="input-hint">Press <kbd>Enter</kbd> to send · Powered by NVIDIA NIM</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
